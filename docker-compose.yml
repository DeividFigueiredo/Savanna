
services:
  postgres:
    image: postgres:16

    container_name: savanna-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: savanna
      POSTGRES_USER: savanna
      POSTGRES_PASSWORD: savanna

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: